<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pujith Chowdary Sakhamuri — Portfolio</title>
  <meta name="description" content="Portfolio of Pujith Chowdary Sakhamuri — IT Infrastructure & Application Support Engineer, Network Data Analyst and Data Engineer.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <!-- Google AdSense -->
  <meta name="google-adsense-account" content="ca-pub-3801443267872719">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3801443267872719" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Top navigation -->
  <header class="nav">
    <div class="wrap nav-inner">
      <a href="#top" class="logo" id="nav-name">Pujith</a>
      <nav class="links">
        <a href="#about">About</a>
        <a href="#experience">Experience</a>
        <a href="#projects">Projects</a>
        <a href="#skills">Skills</a>
        <a href="#contact">Contact</a>
      </nav>
    </div>
  </header>

  <main id="top">
    <!-- Hero -->
    <section class="hero wrap">
      <img id="photo" class="photo" alt="Photo of Pujith">
      <div>
        <p class="eyebrow" id="location"></p>
        <h1 id="name"></h1>
        <p class="title" id="title"></p>
        <p class="subtitle" id="subtitle"></p>
        <div class="buttons" id="hero-buttons"></div>
      </div>
    </section>

    <section id="about" class="wrap section">
      <h2>About</h2>
      <div id="about-text" class="about"></div>
    </section>

    <section id="experience" class="wrap section">
      <h2>Experience</h2>
      <div id="experience-list" class="timeline"></div>
    </section>

    <section id="projects" class="wrap section">
      <h2>Projects</h2>
      <div id="project-list" class="grid"></div>
    </section>

    <section id="skills" class="wrap section">
      <h2>Skills</h2>
      <div id="skill-list" class="grid skills"></div>
    </section>

    <section id="education" class="wrap section">
      <h2>Education</h2>
      <div id="education-list" class="edu"></div>
    </section>

    <section id="pujiverse" class="wrap section">
      <div class="banner">
        <div>
          <h2>Pujiverse Network</h2>
          <p id="pujiverse-text"></p>
        </div>
        <a id="pujiverse-link" class="btn" target="_blank" rel="noopener">Visit Pujiverse</a>
      </div>
    </section>

    <section id="contact" class="wrap section">
      <h2>Contact</h2>
      <div id="contact-list" class="contact"></div>
    </section>
  </main>

  <footer class="wrap footer">
    <p>© <span id="year"></span> <span id="footer-name"></span></p>
  </footer>

  <!-- data.js holds all your content. script.js puts it on the page. -->
  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
